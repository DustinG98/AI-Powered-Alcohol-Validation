# HTTP-only nginx config used:
#   1. By the local development override (docker-compose.local.yml).
#   2. By the production frontend container on first boot, BEFORE the
#      Let's Encrypt cert has been issued. The frontend's custom
#      entrypoint picks this file (rather than the HTTPS one) when
#      /etc/letsencrypt/live/${CERTBOT_DOMAIN}/fullchain.pem does not
#      exist. This lets nginx serve the ACME http-01 challenge on
#      port 80 so certbot can issue the cert.
#
# Once the cert is on disk, restart the frontend container and the
# entrypoint will swap in the HTTPS config (nginx.conf) automatically.

upstream backend_upstream {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    send_timeout          120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Serve the Let's Encrypt http-01 challenge from the shared webroot
    # volume. certbot writes its challenge files to
    # /var/www/certbot/.well-known/acme-challenge/ and nginx serves them
    # back to the validator over HTTP on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_request_buffering off;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

