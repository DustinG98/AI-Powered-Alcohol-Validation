# nginx configuration for the AI-Powered Alcohol Label Verification
# single-VPS deployment.
#
# Layout:
#   /                       -> static frontend (Vite build output, served by nginx)
#   /api/analyze            -> reverse-proxied to the FastAPI backend
#   /docs, /redoc           -> reverse-proxied to the FastAPI backend (Swagger UI)
#   /.well-known/acme-challenge/ -> webroot for Let's Encrypt http-01 challenge
#
# HTTP (80) serves the ACME challenge and redirects everything else to
# HTTPS. HTTPS (443) is the only listener clients should hit once a cert
# has been issued.

upstream backend_upstream {
    server backend:8000;
    keepalive 16;
}

# Redirect plain HTTP to HTTPS, except for the ACME challenge path which
# must remain reachable on 80 for certbot to validate.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server. Active as soon as the cert files exist at the paths
# below. The certbot service (see docker-compose.yml) writes them there.
# $CERTBOT_DOMAIN is substituted by the base image's `envsubst` step
# (which scans /etc/nginx/templates/*.template). The source file is
# mounted at /etc/nginx/templates/default.conf.template in compose.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/$CERTBOT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$CERTBOT_DOMAIN/privkey.pem;

    # Modern TLS config — TLS 1.2 minimum, reasonable cipher list.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upload body size must match (or exceed) the backend's
    # MAX_UPLOAD_SIZE_MB. 20 MB gives a small safety margin.
    client_max_body_size 20m;

    # Reasonable per-request timeouts. PaddleOCR can be slow on first hit.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    send_timeout          120s;

    # Compression for the static frontend.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # ---- API reverse proxy -------------------------------------------------
    # Same-origin: the browser calls /api/... and nginx forwards to backend.
    # The backend's ALLOWED_ORIGINS should include the public origin (e.g.
    # https://your-domain.example) for the CORS preflight to succeed.
    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Streaming-friendly buffering for the analyze endpoint which
        # can return several MB of OCR token data for big batches.
        proxy_buffering    off;
        proxy_request_buffering off;
    }

    # FastAPI auto-generated docs (Swagger UI + ReDoc) live at /docs and
    # /redoc on the backend.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Static frontend ---------------------------------------------------
    # Vite builds into /usr/share/nginx/html (the nginx image default).
    # Cache hashed assets aggressively; never cache index.html.
    location /assets/ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # SPA fallback: every unmatched path serves index.html so the
        # client-side router can take over.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health probe for the orchestrator (no proxy, fast).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
