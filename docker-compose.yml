# Single-VPS deployment. Brings up three services on a private bridge:
#   - backend:  FastAPI / PaddleOCR (NOT exposed to the host; only reachable
#               from nginx on the internal network)
#   - frontend: nginx serving the built Vite bundle + reverse-proxying
#               /api/* and /docs to the backend. Exposes port 80 to the
#               host. Attach your domain's A record to the VPS IP.
#
# The frontend image is built with VITE_API_BASE_URL=/api (same-origin
# calls), so the browser hits /api/analyze and nginx routes it. CORS on
# the backend is configured via ALLOWED_ORIGINS in .env — set it to the
# public origin (e.g. https://your-domain.example) so the preflight
# succeeds.
#
# When you bring a real domain and a TLS cert, add a `listen 443 ssl`
# block to nginx.conf and bind port 443 here. The HTTP block can stay
# for the certbot http-01 challenge or be removed in favor of a 301
# redirect to HTTPS.

services:
  backend:
    build: ./backend
    container_name: alcohol-validation-backend
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - app-net
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      UVICORN_HOST: ${UVICORN_HOST}
      UVICORN_PORT: ${UVICORN_PORT}
      UVICORN_WORKERS: ${UVICORN_WORKERS}
      UVICORN_LOG_LEVEL: ${UVICORN_LOG_LEVEL}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE}
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: alcohol-validation-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-net:
    driver: bridge
